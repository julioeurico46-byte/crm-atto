<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM Atto</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="CRM Atto">
<!-- Atalho legado: mantém os ícones existentes apontando para o CRM na Vercel. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  var CRM='https://atto-crm.vercel.app/';
  if(/[?&]app=1\b/.test(location.search))location.replace(CRM);
  else history.replaceState(null,'',location.pathname+'?app=1');
</script>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#000;color:#fff;font:400 1rem/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:26rem}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
  ol{margin:0;padding-left:1.25rem;text-align:left;color:rgba(255,255,255,.8)}
  li+li{margin-top:6px}
  b{color:#fff}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:10px;background:#FFDE00;color:#000;font-weight:700;text-decoration:none}
  a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>CRM Atto</h1>
  <ol>
    <li>Toque em <b>Compartilhar</b> (o quadrado com a seta) no Safari.</li>
    <li>Escolha <b>Adicionar à Tela de Início</b>. Para instalar a versão atual, abra o CRM pelo botão abaixo e adicione-o à tela de início.</li>
    <li>Pelo ícone, o CRM abre direto.</li>
  </ol>
  <a href="https://atto-crm.vercel.app/">Abrir o CRM agora</a>
</main>
</body>
</html>
